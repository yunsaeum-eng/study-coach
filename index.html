<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>K뷰티 해외영업 학습 코치</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --surface2: #202020;
      --border: #2a2a2a;
      --text: #e8e4dc;
      --text-dim: #666;
      --text-mid: #999;
      --accent: #c8f060;
      --accent2: #4ecdc4;
      --accent3: #fb923c;
      --user-bubble: #1e2a0e;
      --ai-bubble: #181818;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      flex-shrink: 0;
    }
    .topbar-title {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.05em;
    }
    .topbar-sub {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .api-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .api-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      color: var(--text);
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .api-input:focus { border-color: var(--accent); }
    .api-input::placeholder { color: var(--text-dim); }
    .api-save-btn {
      background: var(--accent);
      color: #0f0f0f;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .api-save-btn:hover { opacity: 0.85; }
    .api-status {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      padding: 4px 10px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .api-status.ready { background: #1a2e0a; color: var(--accent); border: 1px solid #2d4a10; }
    .api-status.empty { background: #2a1a0a; color: var(--accent3); border: 1px solid #4a2d10; }

    /* ── QUICK BUTTONS ── */
    .quick-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .quick-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      align-self: center;
      margin-right: 4px;
      white-space: nowrap;
    }
    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      color: var(--text-mid);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #1a2200;
    }

    /* ── CHAT AREA ── */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    .chat-container::-webkit-scrollbar { width: 4px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Welcome message */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .welcome-icon {
      font-size: 36px;
      margin-bottom: 16px;
    }
    .welcome-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .welcome-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.7;
    }
    .welcome-desc em {
      color: var(--accent);
      font-style: normal;
      font-weight: 500;
    }

    /* Messages */
    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 800px;
      width: 100%;
    }
    .msg-row.user { margin-left: auto; flex-direction: row-reverse; }
    .msg-row.assistant { margin-right: auto; }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-row.user .msg-avatar { background: var(--accent); color: #0f0f0f; font-weight: 700; }
    .msg-row.assistant .msg-avatar { background: var(--surface2); border: 1px solid var(--border); color: var(--accent); }

    .msg-bubble {
      padding: 13px 17px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.75;
      max-width: calc(100% - 50px);
    }
    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      border: 1px solid #2d4a10;
      border-top-right-radius: 4px;
      color: #d4f0a0;
    }
    .msg-row.assistant .msg-bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }

    /* Markdown-like formatting in assistant bubbles */
    .msg-bubble strong { color: var(--accent); font-weight: 600; }
    .msg-bubble em { color: var(--accent2); font-style: normal; }
    .msg-bubble code {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--accent3);
    }
    .msg-bubble pre {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin: 10px 0;
      overflow-x: auto;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: #d0cfc8;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg-bubble ul, .msg-bubble ol {
      padding-left: 20px;
      margin: 8px 0;
    }
    .msg-bubble li { margin: 4px 0; }
    .msg-bubble p { margin: 6px 0; }
    .msg-bubble h3 {
      color: var(--accent);
      font-size: 14px;
      margin: 12px 0 6px;
    }
    .msg-bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--text-mid);
      margin: 8px 0;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 17px;
    }
    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: typingPulse 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingPulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.2); }
    }

    /* ── INPUT AREA ── */
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      flex-shrink: 0;
    }
    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 800px;
      margin: 0 auto;
    }
    .input-box {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 160px;
      line-height: 1.6;
      transition: border-color 0.2s;
    }
    .input-box:focus { border-color: var(--accent); }
    .input-box::placeholder { color: var(--text-dim); }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .send-btn:hover { opacity: 0.85; transform: scale(1.03); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 20px; height: 20px; fill: #0f0f0f; }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-dim);
      font-size: 18px;
      transition: all 0.15s;
    }
    .clear-btn:hover { border-color: #ff6b6b; color: #ff6b6b; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 8px;
      font-family: 'DM Mono', monospace;
    }

    /* Error message */
    .error-msg {
      background: #2a0a0a;
      border: 1px solid #4a1010;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #ff8080;
      margin: 0 auto;
      max-width: 800px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .topbar { padding: 12px 16px; flex-wrap: wrap; }
      .api-input { width: 160px; }
      .quick-bar { padding: 8px 16px; }
      .chat-container { padding: 20px 16px; }
      .input-area { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<!-- ── TOP BAR ── -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-dot"></div>
    <div>
      <div class="topbar-title">K-Beauty 해외영업 학습 코치</div>
      <div class="topbar-sub">Business English · Global Sales</div>
    </div>
  </div>
  <div class="api-section">
    <input
      class="api-input"
      type="password"
      id="apiKeyInput"
      placeholder="sk-ant-api03-..."
      autocomplete="off"
    />
    <button class="api-save-btn" onclick="saveApiKey()">저장</button>
    <span class="api-status empty" id="apiStatus">API 키 없음</span>
  </div>
</div>

<!-- ── QUICK BUTTONS ── -->
<div class="quick-bar">
  <span class="quick-label">빠른 질문</span>
  <button class="quick-btn" onclick="quickAsk('지금 쓴 이메일 교정해줘. 붙여넣을게.')">✉️ 이메일 교정</button>
  <button class="quick-btn" onclick="quickAsk('미국 편집숍 바이어 역할 해줘. 내가 K뷰티 브랜드 영업담당자로 영어로 첫 접촉 이메일 보낼게.')">🎭 바이어 롤플레이</button>
  <button class="quick-btn" onclick="quickAsk('이 영어 표현이 자연스러운지 확인해줘: ')">🔍 표현 확인</button>
  <button class="quick-btn" onclick="quickAsk('스킨케어 제품 효능을 영어로 어떻게 표현해? 예시 10개 알려줘.')">💄 스킨케어 영어 표현</button>
  <button class="quick-btn" onclick="quickAsk('Offer Sheet에서 Payment Terms를 영어로 어떻게 쓰는지 예시 보여줘.')">📋 무역 서류 표현</button>
  <button class="quick-btn" onclick="quickAsk('가격 협상 영어 롤플레이 해줘. 내가 바이어한테 가격이 너무 비싸다는 말 들은 상황이야.')">💰 협상 롤플레이</button>
</div>

<!-- ── CHAT AREA ── -->
<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcomeMsg">
    <div class="welcome-icon">🌿</div>
    <div class="welcome-title">안녕하세요, 학습 코치예요</div>
    <div class="welcome-desc">
      K뷰티 해외영업 <em>비즈니스 영어</em> 학습을 도와드려요.<br><br>
      이메일 교정, 바이어 롤플레이, 무역 서류 표현,<br>
      협상 영어까지 — 학습 중 막히는 거 뭐든 물어보세요.<br><br>
      먼저 오른쪽 위에 <em>API 키</em>를 입력하고 저장해주세요.
    </div>
  </div>
</div>

<!-- ── INPUT AREA ── -->
<div class="input-area">
  <div class="input-wrapper">
    <button class="clear-btn" onclick="clearChat()" title="대화 초기화">↺</button>
    <textarea
      class="input-box"
      id="userInput"
      placeholder="질문을 입력하세요... (Shift+Enter로 줄바꿈, Enter로 전송)"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="전송">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">Enter 전송 · Shift+Enter 줄바꿈 · ↺ 대화 초기화</div>
</div>

<script>
  // ── State ──
  let apiKey = localStorage.getItem('claude_api_key') || '';
  let conversationHistory = [];
  let isLoading = false;

  const SYSTEM_PROMPT = `당신은 K뷰티 스킨케어 브랜드의 해외영업 직무를 준비 중인 취업준비생의 전담 학습 코치입니다.

사용자 정보:
- 영어 수준: 듣기 C1, 읽기·일상회화 B2, 비즈니스 영어는 초보
- 목표: K뷰티 스킨케어 브랜드 해외영업 신입 취업 (8~9월 목표)
- 장기 목표: 국내 브랜드에서 경력 쌓은 후 외국계 애슬레저/뷰티 브랜드 이직
- 현재 학습 중: 비즈니스 이메일 쓰기, 무역 서류 작성, 비즈니스 회화
- 7월에 국제무역사 자격증 시험 예정

당신의 역할:
1. 비즈니스 영어 이메일 교정 및 피드백 (어색한 이유까지 설명)
2. 바이어 롤플레이 (미국·일본·동남아 바이어 역할)
3. 무역 서류 표현 (Offer Sheet, Invoice, 계약서 등) 설명
4. 스킨케어 영어 표현 및 업계 용어 설명
5. 협상 영어 표현 및 롤플레이
6. 면접 대비 질문 답변 연습

답변 원칙:
- 이메일 교정 시: 원본 → 교정본 → 어색했던 이유 순으로 제시
- 롤플레이 요청 시: 바로 캐릭터로 진입해서 영어로 대화 시작
- 표현 설명 시: 예문과 함께 실제 사용 맥락 설명
- 한국어로 질문해도 OK, 영어 학습 내용은 영어 예시 포함
- 답변은 명확하고 실용적으로, 불필요한 서론 없이`;

  // ── Init ──
  if (apiKey) {
    document.getElementById('apiKeyInput').value = '••••••••••••••••';
    updateApiStatus(true);
  }

  // ── API Key ──
  function saveApiKey() {
    const input = document.getElementById('apiKeyInput').value.trim();
    if (!input || input.startsWith('•')) {
      if (apiKey) { updateApiStatus(true); return; }
      alert('API 키를 입력해주세요.');
      return;
    }
    if (!input.startsWith('sk-ant-')) {
      alert('올바른 Anthropic API 키 형식이 아니에요. (sk-ant-로 시작)');
      return;
    }
    apiKey = input;
    localStorage.setItem('claude_api_key', apiKey);
    document.getElementById('apiKeyInput').value = '••••••••••••••••';
    updateApiStatus(true);
  }

  function updateApiStatus(ready) {
    const el = document.getElementById('apiStatus');
    if (ready) {
      el.textContent = '✓ 연결됨';
      el.className = 'api-status ready';
    } else {
      el.textContent = 'API 키 없음';
      el.className = 'api-status empty';
    }
  }

  // ── Quick ask ──
  function quickAsk(text) {
    const input = document.getElementById('userInput');
    input.value = text;
    autoResize(input);
    input.focus();
    if (!text.endsWith(': ') && !text.endsWith('. ')) {
      sendMessage();
    }
  }

  // ── Send message ──
  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || isLoading) return;

    if (!apiKey) {
      showError('API 키를 먼저 입력하고 저장해주세요.');
      return;
    }

    // Hide welcome
    const welcome = document.getElementById('welcomeMsg');
    if (welcome) welcome.style.display = 'none';

    // Add user message
    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });
    input.value = '';
    autoResize(input);

    // Show typing
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    const typingId = showTyping();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1500,
          system: SYSTEM_PROMPT,
          messages: conversationHistory
        })
      });

      removeTyping(typingId);

      if (!response.ok) {
        const err = await response.json();
        if (response.status === 401) {
          showError('API 키가 올바르지 않아요. 키를 다시 확인해주세요.');
        } else if (response.status === 429) {
          showError('요청이 너무 많아요. 잠시 후 다시 시도해주세요.');
        } else {
          showError(`오류가 발생했어요: ${err.error?.message || response.status}`);
        }
        conversationHistory.pop();
        return;
      }

      const data = await response.json();
      const reply = data.content[0].text;

      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('assistant', reply);

    } catch (e) {
      removeTyping(typingId);
      showError('네트워크 오류가 발생했어요. 인터넷 연결을 확인해주세요.');
      conversationHistory.pop();
    } finally {
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }

  // ── Render message ──
  function addMessage(role, text) {
    const container = document.getElementById('chatContainer');
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'user' ? '나' : '🌿';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = formatText(text);

    row.appendChild(avatar);
    row.appendChild(bubble);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function formatText(text) {
    // Basic markdown-like formatting
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^(?!<)(.+)$/gm, (m) => m.startsWith('<') ? m : `<p>${m}</p>`);
  }

  // ── Typing indicator ──
  function showTyping() {
    const container = document.getElementById('chatContainer');
    const row = document.createElement('div');
    const id = 'typing-' + Date.now();
    row.id = id;
    row.className = 'msg-row assistant';
    row.innerHTML = `
      <div class="msg-avatar">🌿</div>
      <div class="msg-bubble">
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>`;
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  // ── Error ──
  function showError(msg) {
    const container = document.getElementById('chatContainer');
    const div = document.createElement('div');
    div.className = 'error-msg';
    div.textContent = '⚠️ ' + msg;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    setTimeout(() => div.remove(), 6000);
  }

  // ── Clear ──
  function clearChat() {
    if (conversationHistory.length === 0) return;
    if (!confirm('대화 내용을 모두 지울까요?')) return;
    conversationHistory = [];
    const container = document.getElementById('chatContainer');
    container.innerHTML = `
      <div class="welcome" id="welcomeMsg">
        <div class="welcome-icon">🌿</div>
        <div class="welcome-title">대화가 초기화됐어요</div>
        <div class="welcome-desc">새로운 학습 주제로 시작해보세요.<br>위의 빠른 질문 버튼을 눌러도 돼요.</div>
      </div>`;
  }

  // ── Input helpers ──
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }
</script>
</body>
</html>
